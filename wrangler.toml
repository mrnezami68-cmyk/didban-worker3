name = "market-ai-interpreter"
main = "src/worker.js"
compatibility_date = "2026-10-05"
compatibility_flags = ["nodejs_compat"]

# اتصال هوش مصنوعی لبه کلودفلر
[ai]
binding = "AI"

# ۱. اتصال دیتابیس قیمت‌ها و داده‌های بازار
[[d1_databases]]
binding = "DB"
database_name = "market_db"
database_id = "c99c8fed-bbcd-46a5-af06-594c969bb1d7"

# ۲. اتصال دیتابیس دانشنامه و مفاهیم مشترک دارالفنون
[[d1_databases]]
binding = "KNOWLEDGE_DB"
database_name = "market_knowledge_db"
database_id = "5d57217e-6f65-43a1-a121-35e36f5f9b25"

[observability]
enabled = true

# Phase 2-3H / M10 (P2): پایشگر synthetic — هر ۶ ساعت (درس M9: شکست بی‌صدا ممنوع)
# هشدار push نیازمند تنظیم secret با نام ADMIN_SECRET در پنل همین ورکر است (هم‌مقدار با ورکر۲)؛ بدون آن فقط console.log (fail-safe).
[triggers]
crons = ["0 */6 * * *"]

# Phase 2-3H / M10.2: Service Bindings — پروب سلامت و کانال هشدار بدون عبور از اینترنت
# (کشف M10.1: فراخوانی workers.dev→workers.dev درون پلتفرم 404 می‌گیرد)
[[services]]
binding = "SVC_W1"
service = "market-data-collector"

[[services]]
binding = "SVC_W2"
service = "market-reporting-push"

[[services]]
binding = "SVC_W4"
service = "market-auth-gateway"
